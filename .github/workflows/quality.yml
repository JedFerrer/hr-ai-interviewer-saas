name: Release quality
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11.9'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.16.0'
      - name: Install locked Python
        run: |
          python -m pip install uv==0.12.1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          uv venv .venv --python 3.11.9
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          uv pip sync backend/requirements.lock --python .venv/Scripts/python.exe --require-hashes
      - name: Verify pinned toolchain
        run: .venv/Scripts/python.exe scripts/validate_ci.py
      - name: Python correctness lint
        run: .venv/Scripts/python.exe scripts/check.py lint
      - name: Run backend
        run: .venv/Scripts/python.exe scripts/check.py backend
  frontend:
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11.9'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.16.0'
      - name: Install locked Python
        run: |
          python -m pip install uv==0.12.1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          uv venv .venv --python 3.11.9
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          uv pip sync backend/requirements.lock --python .venv/Scripts/python.exe --require-hashes
      - name: Verify pinned toolchain
        run: .venv/Scripts/python.exe scripts/validate_ci.py
      - name: Run frontend
        run: .venv/Scripts/python.exe scripts/check.py frontend
  windows-demo:
    env:
      HR_CHECK_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}-windows-demo
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11.9'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.16.0'
      - name: Install locked Python
        run: |
          python -m pip install uv==0.12.1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          uv venv .venv --python 3.11.9
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          uv pip sync backend/requirements.lock --python .venv/Scripts/python.exe --require-hashes
      - name: Verify pinned toolchain
        run: .venv/Scripts/python.exe scripts/validate_ci.py
      - name: Install locked frontend
        run: npm --prefix frontend ci --fetch-retries=0
      - name: Run windows-demo
        run: .venv/Scripts/python.exe scripts/check.py demo
      - name: Stop owned demo resources
        if: always()
        run: .venv/Scripts/python.exe scripts/cleanup_checks.py
  browser-smoke:
    env:
      HR_CHECK_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}-browser-smoke
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11.9'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.16.0'
      - name: Install locked Python
        run: |
          python -m pip install uv==0.12.1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          uv venv .venv --python 3.11.9
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          uv pip sync backend/requirements.lock --python .venv/Scripts/python.exe --require-hashes
      - name: Verify pinned toolchain
        run: .venv/Scripts/python.exe scripts/validate_ci.py
      - name: Install locked frontend
        run: npm --prefix frontend ci --fetch-retries=0
      - name: Install locked Chromium
        run: node frontend/node_modules/playwright/cli.js install chromium
      - name: Run browser-smoke
        run: .venv/Scripts/python.exe scripts/check.py browser
      - name: Stop owned demo resources
        if: always()
        run: .venv/Scripts/python.exe scripts/cleanup_checks.py
  dependencies:
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11.9'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.16.0'
      - name: Install locked Python
        run: |
          python -m pip install uv==0.12.1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          uv venv .venv --python 3.11.9
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          uv pip sync backend/requirements.lock --python .venv/Scripts/python.exe --require-hashes
      - name: Verify pinned toolchain
        run: .venv/Scripts/python.exe scripts/validate_ci.py
      - name: Install locked scanners
        run: |
          uv venv .security-venv --python 3.11.9
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          uv pip sync security/requirements.lock --python .security-venv/Scripts/python.exe --require-hashes
      - name: Run dependencies
        run: .venv/Scripts/python.exe scripts/check.py dependencies
  secrets:
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11.9'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.16.0'
      - name: Install locked Python
        run: |
          python -m pip install uv==0.12.1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          uv venv .venv --python 3.11.9
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          uv pip sync backend/requirements.lock --python .venv/Scripts/python.exe --require-hashes
      - name: Verify pinned toolchain
        run: .venv/Scripts/python.exe scripts/validate_ci.py
      - name: Install locked scanners
        run: |
          uv venv .security-venv --python 3.11.9
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          uv pip sync security/requirements.lock --python .security-venv/Scripts/python.exe --require-hashes
      - name: Run secrets
        run: .venv/Scripts/python.exe scripts/check.py secrets
